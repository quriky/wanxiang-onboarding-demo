function setGuideInert(on){['sidebar','main','demo-bar'].forEach(id=>$('#'+id).inert=on)}
function startGuide(){savePortalStatus('started');caseFilter='全部案例';currentCase=0;custom=false;lastFocus=document.activeElement;$('#welcome').close();closeAction();step=0;$('#guide').style.display='block';setGuideInert(true);showStep()}
function showStep(){const s=steps[step];render(s.page);$('#coach-title').textContent=s.title;$('#coach-desc').textContent=s.desc;$('#coach-tip').textContent=s.tip;$('#prev').disabled=step===0;$('#next').textContent=s.nextLabel||(step===steps.length-1?'开始体验 →':'下一步 →');$('#dots').innerHTML=steps.map((_,i)=>`<i class="${i===step?'current':''}"></i>`).join('');$('#progress').style.width=((step+1)/steps.length*100)+'%';$('.coach-label').innerHTML=`<span class="coach-brand-icon">${icon(s.page==='recharge'?'mine':s.page)}</span><span>认识万象百应<small>功能导览</small></span><span class="coach-count">${String(step+1).padStart(2,'0')} <i>/ ${String(steps.length).padStart(2,'0')}</i></span>`;$('#coach').setAttribute('aria-label',`第 ${step+1} 步，共 ${steps.length} 步`);const target=$(s.target);target.scrollIntoView({block:'center',behavior:'instant'});requestAnimationFrame(()=>{positionCoach();$('#coach').focus({preventScroll:true})})}
function positionCoach(){if(step<0)return;const s=steps[step],r=$(s.target).getBoundingClientRect(),pad=6,spot=$('#spot'),c=$('#coach'),W=innerWidth,H=innerHeight;let visible={left:Math.max(7,r.left-pad),top:Math.max(7,r.top-pad),right:Math.min(W-7,r.right+pad),bottom:Math.min(H-7,r.bottom+pad)};Object.assign(spot.style,{left:visible.left+'px',top:visible.top+'px',width:Math.max(0,visible.right-visible.left)+'px',height:Math.max(0,visible.bottom-visible.top)+'px'});const cw=c.offsetWidth,ch=c.offsetHeight,gap=20;let side=s.side,x,y;const fitsBottom=H-visible.bottom>=ch+gap+10,fitsTop=visible.top>=ch+gap+10;
if(side==='left'&&visible.left>=cw+gap+12){x=visible.left-cw-gap;y=Math.max(58,Math.min(visible.top-10,H-ch-14))}
else if(side==='right'&&W-visible.right>=cw+gap+12){x=visible.right+gap;y=Math.max(58,Math.min(visible.top-10,H-ch-14))}
else if(!fitsBottom&&!fitsTop&&W-visible.right>=cw+gap+12){side='right';x=visible.right+gap;y=Math.max(58,Math.min(visible.top-10,H-ch-14))}
else if(!fitsBottom&&!fitsTop&&visible.left>=cw+gap+12){side='left';x=visible.left-cw-gap;y=Math.max(58,Math.min(visible.top-10,H-ch-14))}
else if(fitsBottom){side='bottom';x=visible.left;y=visible.bottom+gap}
else if(fitsTop){side='top';x=visible.left;y=visible.top-ch-gap}
else{side='bottom';x=Math.max(14,(W-cw)/2);y=H-ch-14; // On small screens, keep the highlighted anchor compact above the coach.
const maxBottom=y-gap;visible.bottom=Math.min(visible.bottom,maxBottom);if(visible.top>maxBottom-35)visible.top=Math.max(53,maxBottom-70);spot.style.top=visible.top+'px';spot.style.height=Math.max(35,visible.bottom-visible.top)+'px';}
x=Math.max(14,Math.min(x,W-cw-14));y=Math.max(12,Math.min(y,H-ch-12));c.dataset.side=side;c.style.left=x+'px';c.style.top=y+'px';c.style.setProperty('--arrow-x',Math.max(24,Math.min(visible.left+(visible.right-visible.left)/2-x,cw-30))+'px');c.style.setProperty('--arrow-y',Math.max(25,Math.min((visible.top+visible.bottom)/2-y,ch-30))+'px');const x0=visible.left,y0=visible.top,x1=visible.right,y1=Math.max(y0+35,visible.bottom);$('#guide-veil').style.clipPath=`polygon(evenodd,0px 0px,100% 0px,100% 100%,0px 100%,0px 0px,${x0}px ${y0}px,${x1}px ${y0}px,${x1}px ${y1}px,${x0}px ${y1}px,${x0}px ${y0}px)`;}
function endGuide(finished=false){savePortalStatus(finished?'completed':'skipped');step=-1;$('#guide').style.display='none';setGuideInert(false);if(finished){render('recharge');window.scrollTo(0,0);toast('引导完成，可以自由浏览。右上角可重新查看。');$('#replay').focus({preventScroll:true})}else{lastFocus?.focus?.();toast('已退出引导，可以自由浏览。右上角可重新开始。')}}
$('#next').onclick=()=>{if(step<0)return;if(steps[step].action==='subscribe'){subscribed=true;added=true;}if(steps[step].action==='download'){downloaded=true;}if(step===steps.length-1)endGuide(true);else{step++;showStep()}};$('#prev').onclick=()=>{if(step>0){step--;showStep()}};$('#skip').onclick=()=>endGuide();$('#guide-close').onclick=()=>endGuide();$('#replay').onclick=startGuide;$('#start').onclick=startGuide;$('#welcome-close').onclick=()=>$('#welcome').close();$('#welcome-skip').onclick=()=>$('#welcome').close();$('#action-close').onclick=closeAction;$('#reset').onclick=()=>{amount=10;custom=false;added=false;subscribed=false;downloaded=false;render('home');window.scrollTo(0,0);$('#welcome').showModal();animateLetter()};
document.addEventListener('keydown',e=>{if($('#welcome').open&&(e.code==='Space'||e.key===' ')){if(e.target.isContentEditable||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;e.preventDefault();if(!e.repeat){if($('#welcome').classList.contains('letter-complete'))startGuide();else finishLetter();}return;}if(step<0)return;if(e.code==='Space'||e.key===' '){const tag=e.target.tagName;if(e.target.isContentEditable||['INPUT','TEXTAREA','SELECT'].includes(tag))return;e.preventDefault();if(!e.repeat)$('#next').click();return;}if(e.key==='Escape'){e.preventDefault();endGuide()}if(e.key==='Tab'){const focus=[...$('#coach').querySelectorAll('button:not(:disabled)')];if(e.shiftKey&&(document.activeElement===focus[0]||document.activeElement===$('#coach'))){e.preventDefault();focus.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===focus.at(-1)){e.preventDefault();focus[0].focus()}}if(e.key==='ArrowRight')$('#next').click();if(e.key==='ArrowLeft')$('#prev').click()});

const PORTAL_STATE='wx-unified-portal-state-v1',PORTAL_STATUS='wx-unified-portal-status-v1',HANDOFF='wx-unified-handoff-v1';
function readLocal(key,fallback=null){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
function persistPortal(){if(WxCampaign.resetting)return;try{localStorage.setItem(PORTAL_STATE,JSON.stringify({page,amount,subscribed,downloaded,added,currentCase,caseFilter,remixDraft}))}catch{}}

function initPortal(){const saved=readLocal(PORTAL_STATE),status=readLocal(PORTAL_STATUS);if(saved){amount=Number.isInteger(saved.amount)&&saved.amount>=10?saved.amount:10;subscribed=saved.subscribed===true;downloaded=saved.downloaded===true;added=saved.added===true;currentCase=Number.isInteger(saved.currentCase)&&examples[saved.currentCase]?saved.currentCase:0;caseFilter=['全部案例','内容创作','产品营销','设计办公'].includes(saved.caseFilter)?saved.caseFilter:'全部案例';remixDraft=typeof saved.remixDraft==='string'?saved.remixDraft:'';}
const valid=['home','apps','cases','recharge','mine','assets','models','kaigong','case-detail'];const activityRoute=new URLSearchParams(location.search).get('activityRoute');const taskPage=['cases','recharge','kaigong'].includes(activityRoute)?activityRoute:null;render(taskPage||(status&&saved&&valid.includes(saved.page)?saved.page:'home'));if(taskPage)savePortalStatus('activity-route');$('#reset').onclick=resetPortalDemo;

let introTimer;
function animateLetter(){
  clearTimeout(introTimer);
  const welcome=$('#welcome');welcome.classList.remove('letter-complete');
  let delay=240;
  welcome.querySelectorAll('[data-typewriter]').forEach(el=>{
    const text=el.dataset.originalText||el.textContent;el.dataset.originalText=text;el.setAttribute('aria-label',text);el.replaceChildren();
    for(const char of [...text]){const span=document.createElement('span');span.className='typed-char';span.textContent=char;span.setAttribute('aria-hidden','true');span.style.setProperty('--char-delay',delay);el.append(span);delay+=23;}
    delay+=200;
  });
  welcome.style.setProperty('--signature-delay',(delay+100)+'ms');
  $('#intro-skip').textContent='直接显示完整文字';
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){finishLetter();return;}
  introTimer=setTimeout(finishLetter,delay+650);
}
function finishLetter(){clearTimeout(introTimer);$('#welcome').classList.add('letter-complete');$('#intro-skip').textContent='重播文字动画';}
$('#intro-skip').onclick=()=>$('#welcome').classList.contains('letter-complete')?animateLetter():finishLetter();
$('#welcome').addEventListener('close',()=>clearTimeout(introTimer));

window.addEventListener('resize',positionCoach);window.addEventListener('scroll',positionCoach,{passive:true});initPortal();
